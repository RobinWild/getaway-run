<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Explorer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --page: #0d0e14; --surface: #16171f; --surface-2: #1f212b; --ink: #f2f2f6; --ink-2: #c3c2b7; --muted: #8d8f99;
    --border: rgba(255,255,255,.12); --good: #0ca30c; --bad: #d03b3b; --warn: #fab219; --gold: #ffd60a; --gray: #6b6c75;
    --panel: 440px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button, select { font: inherit; color: var(--ink); cursor: pointer; }
  #stage { position: fixed; top: 0; left: 0; bottom: 0; right: var(--panel); }
  #stage canvas { display: block; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel); background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 5; }
  #panel header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  #panel header .top { display: flex; justify-content: space-between; align-items: baseline; }
  #panel header h1 { font-size: 17px; margin: 0; }
  #panel header nav a { color: var(--ink-2); font-size: 13px; margin-left: 10px; }
  #seed { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  #stale { display: none; color: var(--warn); font-size: 12px; }
  #panelBody { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
  h2 { font-size: 16px; margin: 12px 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h3 { font-size: 13px; margin: 16px 0 6px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: rgba(255,214,10,.15); color: var(--gold); }
  .tag.off { background: rgba(255,255,255,.08); color: var(--ink-2); }
  .trail { list-style: none; padding: 0; margin: 10px 0 0; font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; }
  .trail li::before { content: "↳ "; color: var(--muted); }
  .trail li.here { color: var(--ink); font-weight: 600; }
  .linkish { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; }
  .prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 10px; }
  .prices div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .prices small { display: block; color: var(--muted); font-size: 11px; }
  .prices b { font-size: 18px; }
  .act { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
  .act:hover { border-color: var(--gold); }
  .act.primary { width: 100%; background: #2f6bff; border-color: #2f6bff; color: #fff; padding: 10px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pool { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .cell { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 5px; font-size: 13px; font-weight: 800; border: 0; padding: 0; color: rgba(255,255,255,.55); }
  .cell.crash { background: rgba(208,59,59,.28); }
  .cell.escape { background: rgba(12,163,12,.24); }
  .cell.rec { color: #fff; cursor: pointer; }
  .cell.crash.rec { background: var(--bad); }
  .cell.escape.rec { background: var(--good); }
  button.cell:hover { filter: brightness(1.25); }
  .cell.pick { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--gold); }
  .cell.watching { outline: 2px solid #fff; outline-offset: 1px; }
  .cell.tilted::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
  .cell.mini { display: inline-flex; width: 16px; height: 16px; font-size: 10px; vertical-align: middle; margin-right: 5px; }
  .cell.mini.pick { box-shadow: 0 0 0 1px var(--surface), 0 0 0 3px var(--gold); }
  .key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .key span { display: inline-flex; align-items: center; }
  .sq { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  .branches { display: flex; flex-direction: column; gap: 6px; }
  .branch { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; border-left: 4px solid var(--good); }
  .branch.crash { border-left-color: var(--bad); }
  .branch:hover { border-color: var(--gold); }
  .branch.watching { background: #2a2c38; }
  .bnum { font-weight: 800; color: var(--muted); min-width: 20px; }
  .spine { list-style: none; padding: 0; margin: 0; font-size: 12px; display: flex; flex-direction: column; gap: 2px; }
  .spine li.here { font-weight: 700; }
  .spine li.here .linkish { color: var(--ink); }
  .btext { display: flex; flex-direction: column; } .btext small { color: var(--muted); }
  details { margin-top: 12px; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
  summary { cursor: pointer; font-weight: 700; }
  details p { color: var(--ink-2); font-size: 13px; }
  .strip { width: 100%; height: auto; display: block; }
  .f-c, .sq.f-c { fill: var(--bad); background: var(--bad); }
  .f-r, .sq.f-r { fill: var(--good); background: var(--good); }
  .f-C, .sq.f-C { fill: rgba(208,59,59,.35); background: rgba(208,59,59,.35); }
  .f-R, .sq.f-R { fill: rgba(12,163,12,.35); background: rgba(12,163,12,.35); }
  .f-d, .sq.f-d { fill: var(--warn); background: var(--warn); }
  .f-s, .sq.f-s { fill: var(--gray); background: var(--gray); }
  .tiltUp, .tiltDown, .sq.tiltUp { fill: var(--ink-2); background: var(--ink-2); }
  .stripBase { stroke: var(--muted); stroke-width: .6; }
  .result { border-radius: 10px; padding: 10px 12px; margin-top: 12px; border: 1px solid var(--border); }
  .result h3 { margin: 0 0 4px; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
  .result.bad { background: rgba(208,59,59,.14); border-color: rgba(208,59,59,.5); }
  .result.good { background: rgba(12,163,12,.14); border-color: rgba(12,163,12,.5); }
  #bar { position: fixed; left: 16px; bottom: 16px; right: calc(var(--panel) + 16px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; z-index: 4; }
  #bar button { background: rgba(13,14,20,.85); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; }
  #bar button.on { background: var(--gold); color: #2c2300; border-color: var(--gold); font-weight: 700; }
  #speeds { display: flex; gap: 4px; }
  #live { position: fixed; top: 16px; left: 16px; width: 290px; background: rgba(13,14,20,.85); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; z-index: 4; visibility: hidden; font-size: 13px; }
  #liveHullBox { height: 7px; background: rgba(255,255,255,.14); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #liveHull { height: 100%; width: 100%; background: #7cff6b; }
  @media (max-width: 900px) {
    :root { --panel: 0px; }
    #stage { bottom: 45vh; right: 0; }
    #panel { top: 55vh; width: 100%; border-left: 0; border-top: 1px solid var(--border); }
    #bar { right: 16px; bottom: calc(45vh + 10px); }
    #live { width: calc(100vw - 32px); }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="live">
    <div id="liveWhat"></div>
    <div class="muted" id="liveTime"></div>
    <div id="liveHullBox"><div id="liveHull"></div></div>
  </div>
  <div id="bar">
    <button id="pause">❚❚ Pause</button>
    <div id="speeds"><button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1">1×</button><button data-speed="2">2×</button></div>
    <button id="backBtn" title="B">⇤ Checkpoint</button>
    <button id="restart">⇤⇤ Start of run</button>
  </div>
  <aside id="panel">
    <header>
      <div class="top"><h1>Branch explorer</h1><nav><a href="./">Game</a><a href="analysis.html">Analysis</a></nav></div>
      <select id="seed" aria-label="Run"></select>
      <div id="stale">⚠ These runs were recorded with different levers from the current ones. Run  npm run export  to re-record them.</div>
    </header>
    <div id="panelBody"><p class="muted">Loading…</p></div>
  </aside>
  <script type="module" src="/src/view/explain.ts"></script>
</body>
</html>
